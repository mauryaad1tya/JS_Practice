<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <div id="box">
            <h1 id="heading">Come get your BMI</h1>
            <input type="number" id="height" placeholder="Enter your height in cm">
            <input type="number" id="weight" placeholder="Enter your weight in kg">
            <button id="calculate">Calculate</button>
            <h2 id="bmi">Enter details to calculate the BMI</h2>
            <h2 id="stat">Status : -</h2>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
